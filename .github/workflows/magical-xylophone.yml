name: Assemble magical xylophone welcome

on:
  push:
    branches:
      - feat/storybook-sound-design-20261018
    paths:
      - .github/workflows/magical-xylophone.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Layer real glockenspiel chimes under real xylophone
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Percussion/Glock'
          curl -fsSL --retry 3 --max-time 30 "${SOURCE}/glock_medium_C6.wav" -o /tmp/glock-c6.wav
          curl -fsSL --retry 3 --max-time 30 "${SOURCE}/glock_medium_G6.wav" -o /tmp/glock-g6.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i public/sounds/xylophone-welcome.wav \
            -i /tmp/glock-c6.wav -i /tmp/glock-g6.wav \
            -filter_complex "[0:a]aresample=24000,aformat=channel_layouts=mono,volume=0.89,apad=pad_dur=1.0[base];[1:a]aresample=24000,aformat=channel_layouts=mono,silenceremove=start_periods=1:start_threshold=-49dB,atrim=duration=0.76,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.011,afade=t=out:st=0.59:d=0.17,volume=0.15,adelay=760:all=1[sparkle1];[2:a]aresample=24000,aformat=channel_layouts=mono,silenceremove=start_periods=1:start_threshold=-49dB,atrim=duration=0.72,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.011,afade=t=out:st=0.52:d=0.20,volume=0.09,adelay=1100:all=1[sparkle2];[base][sparkle1][sparkle2]amix=inputs=3:duration=longest:normalize=0,atrim=duration=1.85,afade=t=out:st=1.63:d=0.22,alimiter=limit=0.87[out]" \
            -map "[out]" -ac 1 -ar 24000 -c:a pcm_s16le public/sounds/magical-welcome.wav
          test -s public/sounds/magical-welcome.wav
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 public/sounds/magical-welcome.wav
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sounds/magical-welcome.wav
          git commit -m "Add magical CC0 xylophone and glockenspiel welcome"
          git push origin HEAD:feat/storybook-sound-design-20261018
