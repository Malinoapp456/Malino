name: Assemble recorded xylophone preview

on:
  push:
    branches:
      - feat/storybook-sound-design-20261018
    paths:
      - .github/workflows/recorded-xylophone.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install sound tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create genuine xylophone opening jingle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Percussion/Xylo'
          curl -fsSL --retry 3 --max-time 30 "${SOURCE}/Xylo_Medium_G4_ff_01_far.wav" -o /tmp/xylo-g4.wav
          curl -fsSL --retry 3 --max-time 30 "${SOURCE}/Xylo_Medium_C5_ff_01_far.wav" -o /tmp/xylo-c5.wav
          curl -fsSL --retry 3 --max-time 30 "${SOURCE}/Xylo_Medium_G5_ff_01_far.wav" -o /tmp/xylo-g5.wav
          curl -fsSL --retry 3 --max-time 30 "${SOURCE}/Xylo_Medium_C6_ff_01_far.wav" -o /tmp/xylo-c6.wav
          mkdir -p public/sounds
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/xylo-g4.wav -i /tmp/xylo-c5.wav \
            -i /tmp/xylo-g5.wav -i /tmp/xylo-c6.wav \
            -filter_complex "[0:a]aresample=24000,aformat=channel_layouts=mono,silenceremove=start_periods=1:start_threshold=-50dB,atrim=duration=0.32,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.008,afade=t=out:st=0.24:d=0.08,adelay=0:all=1[n0];[1:a]aresample=24000,aformat=channel_layouts=mono,silenceremove=start_periods=1:start_threshold=-50dB,atrim=duration=0.32,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.008,afade=t=out:st=0.24:d=0.08,adelay=200:all=1[n1];[2:a]aresample=24000,aformat=channel_layouts=mono,silenceremove=start_periods=1:start_threshold=-50dB,atrim=duration=0.36,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.008,afade=t=out:st=0.27:d=0.09,adelay=410:all=1[n2];[3:a]aresample=24000,aformat=channel_layouts=mono,silenceremove=start_periods=1:start_threshold=-50dB,atrim=duration=0.68,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.008,afade=t=out:st=0.55:d=0.13,adelay=630:all=1[n3];[n0][n1][n2][n3]amix=inputs=4:duration=longest:normalize=0,volume=1.65,alimiter=limit=0.88[out]" \
            -map "[out]" -ac 1 -ar 24000 -c:a pcm_s16le public/sounds/xylophone-welcome.wav
          test -s public/sounds/xylophone-welcome.wav
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 public/sounds/xylophone-welcome.wav
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sounds/xylophone-welcome.wav
          git commit -m "Add genuine CC0 xylophone welcome from VSCO 2"
          git push origin HEAD:feat/storybook-sound-design-20261018
